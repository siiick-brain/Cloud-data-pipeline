# Memory budget: 6.6 GB total across every service (see docs/contracts/env.md).
# Host ports bind to 127.0.0.1 only.
name: pipeline

x-airflow: &airflow
  build:
    context: .
    dockerfile: dags/Dockerfile
  image: pipeline-airflow:local
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__METRICS__OTEL_ON: "True"
    AIRFLOW__METRICS__OTEL_HOST: otel-collector
    AIRFLOW__METRICS__OTEL_PORT: "4318"
    WAREHOUSE_URL: postgresql://pipeline:${PIPELINE_DB_PASSWORD}@postgres:5432/warehouse
    SPARK_TRIGGER_URL: http://spark:8000
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SERVICE_NAME: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./quality:/opt/airflow/quality
    - ./governance:/opt/airflow/governance
    - ./sql:/opt/airflow/sql:ro
    - ./tests:/opt/airflow/tests
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.16-alpine
    mem_limit: 800m
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_dim_date.sql:/docker-entrypoint-initdb.d/02_dim_date.sql:ro
      - ./sql/03_unknown_members.sql:/docker-entrypoint-initdb.d/03_unknown_members.sql:ro
      - ./sql/04_grants.sql:/docker-entrypoint-initdb.d/04_grants.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    mem_limit: 800m
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7.4.12-alpine
    mem_limit: 200m
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  consumer:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: pipeline-ingest:local
    mem_limit: 300m
    restart: unless-stopped
    command: ["python", "-m", "ingest.consumer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WAREHOUSE_URL: postgresql://pipeline:${PIPELINE_DB_PASSWORD}@postgres:5432/warehouse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ingest-consumer
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 60)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: pipeline-spark:local
    mem_limit: 1500m
    restart: unless-stopped
    environment:
      DELTA_ROOT: /data/delta
      JDBC_URL: jdbc:postgresql://postgres:5432/warehouse
      JDBC_USER: pipeline
      JDBC_PASSWORD: ${PIPELINE_DB_PASSWORD}
      SPARK_DRIVER_MEMORY: 1g
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: spark-jobs
    volumes:
      - delta:/data/delta
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  airflow-scheduler:
    <<: *airflow
    mem_limit: 1000m
    restart: unless-stopped
    command: ["bash", "/opt/airflow/dags/start_scheduler.sh"]
    # the first scheduled elt_gold run calls Spark, so Spark must be listening before it starts
    depends_on:
      postgres: {condition: service_healthy}
      spark: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  airflow-webserver:
    <<: *airflow
    mem_limit: 500m
    restart: unless-stopped
    # starts alongside the scheduler and waits only for the schema migration
    command: ["bash", "-c", "airflow db check-migrations --migration-wait-timeout 300 && exec airflow webserver"]
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  floci:
    image: floci/floci:2.5.0
    mem_limit: 400m
    restart: unless-stopped
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    build:
      context: infra
      dockerfile: otel.Dockerfile
    image: pipeline-otel:local
    mem_limit: 200m
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.16.0
    mem_limit: 400m
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.6.16
    mem_limit: 300m
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/json:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on:
      postgres: {condition: service_healthy}
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: pipeline-mcp:local
    mem_limit: 200m
    restart: unless-stopped
    environment:
      MCP_TOKEN: ${MCP_TOKEN}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS}
      MCP_HOST: 0.0.0.0
      MCP_AUDIT_LOG: /tmp/mcp-audit.log
      DELTA_ROOT: /data/delta
      WAREHOUSE_RO_URL: postgresql://mcp_ro:${MCP_DB_PASSWORD}@postgres:5432/warehouse
      AIRFLOW_DB_URL: postgresql://mcp_ro:${MCP_DB_PASSWORD}@postgres:5432/airflow
    volumes:
      - delta:/data/delta:ro
    ports: ["127.0.0.1:${MCP_PORT:-8765}:8765"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  kafka-data:
  delta:
  airflow-logs:
